name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    name: Publish TypeScript packages to npm (OIDC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript build & typecheck
        run: |
          pnpm -r build
          pnpm -r typecheck

      - name: Pre-release audit
        run: pnpm run audit:release

      - name: Publish to npm with provenance (idempotent)
        run: |
          for dir in "packages/typescript/core" "packages/typescript/trpc-adapter" "packages/typescript/dart-generator" "packages/typescript/cli"; do
            pkg=$(node -p "require('./${dir}/package.json').name")
            VER=$(node -p "require('./${dir}/package.json').version")
            if npm view "${pkg}@${VER}" version >/dev/null 2>&1; then
              echo "✓ ${pkg}@${VER} is already published on npm — skipping"
            else
              echo "Publishing ${pkg}@${VER} from ${dir}..."
              pnpm --filter "./${dir}" publish --access public --no-git-checks --provenance
            fi
          done

  publish-pub:
    name: Publish Dart packages to pub.dev (OIDC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Flutter & Dart
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Dart manifests for standalone publishing
        run: node scripts/prepare-publish.mjs

      - name: Mint pub.dev OIDC token & publish (idempotent)
        env:
          PUB_HOSTED_URL: "https://pub.dev"
        run: |
          TOKEN_JSON=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://pub.dev")
          OIDC_TOKEN=$(echo "$TOKEN_JSON" | jq -r .value)
          dart pub token add https://pub.dev --env-var PUB_OIDC_TOKEN <<< "$OIDC_TOKEN" || true
          export PUB_OIDC_TOKEN="$OIDC_TOKEN"

          VER=$(node -p "require('./packages/typescript/core/package.json').version")

          if curl -fsSL "https://pub.dev/api/packages/trpc_dart/versions/${VER}" >/dev/null 2>&1; then
            echo "✓ trpc_dart@${VER} is already published on pub.dev — skipping"
          else
            (cd packages/dart/trpc_dart && dart pub get && dart pub publish --force)
          fi

          if curl -fsSL "https://pub.dev/api/packages/trpc_flutter/versions/${VER}" >/dev/null 2>&1; then
            echo "✓ trpc_flutter@${VER} is already published on pub.dev — skipping"
          else
            cd packages/dart/trpc_flutter
            for attempt in $(seq 1 24); do
              if flutter pub get; then
                break
              fi
              echo "Waiting for trpc_dart@${VER} to propagate on pub.dev CDN (attempt ${attempt}/24)..."
              sleep 10
            done
            git checkout -- analysis_options.yaml 2>/dev/null || true
            dart pub publish --force
          fi
